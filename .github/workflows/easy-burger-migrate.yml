# =============================================================================
# Easy Burger — amorçage de la base
# -----------------------------------------------------------------------------
# Joue supabase/bootstrap.sql sur le projet Supabase. À lancer UNE FOIS, sur
# un projet neuf : le fichier crée les tables, il n'est pas rejouable.
#
# Déclenchement manuel uniquement, avec confirmation explicite : on ne veut
# pas qu'une poussée malheureuse touche une base de production.
#
# Secret nécessaire :
#   SUPABASE_DB_URL   Supabase → Project Settings → Database → Connection
#                     string (URI). Contient le mot de passe : il reste dans
#                     les secrets GitHub, jamais ailleurs.
# =============================================================================
name: Easy Burger — Amorcer la base

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Taper AMORCER pour confirmer'
        required: true
        default: ''

jobs:
  amorcer:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Vérifier la confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "AMORCER" ]; then
            echo "::error::Confirmation absente. Relancer en tapant AMORCER."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Vérifier le secret
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::Secret SUPABASE_DB_URL manquant."
            exit 1
          fi

      - name: Installer psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Refuser une base déjà amorcée
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # bootstrap.sql n'est pas rejouable : mieux vaut refuser proprement
          # que laisser une erreur à mi-parcours sur une base à moitié faite.
          existing=$(psql "$PGURL" -tAc \
            "select count(*) from information_schema.tables
              where table_schema='public' and table_name='customers'")
          if [ "$existing" != "0" ]; then
            echo "::error::La base contient déjà la table customers. Amorçage annulé."
            exit 1
          fi

      - name: Jouer bootstrap.sql
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f easy-burger/supabase/bootstrap.sql
          echo "Tables créées : $(psql "$PGURL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")"
          echo "Produits au menu : $(psql "$PGURL" -tAc \
            "select count(*) from public.products where is_listed")"

      - name: Rappel
        run: |
          echo "Reste à créer le compte superadmin :"
          echo "  1. Supabase → Authentication → Users → Add user"
          echo "  2. SQL Editor :"
          echo "     insert into public.staff_users (id, name, role)"
          echo "     values ('<uuid>', 'Mamoune', 'superadmin');"
