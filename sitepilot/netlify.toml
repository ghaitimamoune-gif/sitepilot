# ============================================================
# SitePilot — Configuration Netlify
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

# Plugin officiel Next.js — gère SSR, API routes, middleware
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Les variables d'environnement Supabase doivent être ajoutées
# dans : Netlify → Site settings → Environment variables
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
