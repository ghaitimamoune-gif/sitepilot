# ============================================================
# Easy Burger — configuration Netlify
# Base directory à régler sur `easy-burger` dans l'UI Netlify
# (Site settings → Build & deploy → Base directory)
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Variables à définir dans Netlify → Site settings → Environment variables :
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY  (scope : Functions uniquement)
